{% extends 'base.html' %}

{% block title %}Blogs - MyApp{% endblock %}

{% block content %}
  <h1>Latest Blog Posts</h1>

  <div class="blogs-container">
    {% for blog in blogs %}
      <div class="blog-card {% if blog.featured %}featured{% endif %}">
        {% if blog.featured %}
          <span class="featured-badge">Featured</span>
        {% endif %}
        <h2>{{ blog.title }}</h2>
        <p class="author">by {{ blog.author }}</p>
        <p class="snippet">{{ blog.snippet }}</p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
