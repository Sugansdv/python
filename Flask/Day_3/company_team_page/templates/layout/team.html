{% extends 'base.html' %}

{% block title %}Team - MyApp{% endblock %}

{% block content %}
  <h1>Our Team</h1>
  <div class="team-container">
    {% for member in team %}
      <div class="team-card {% if member.role == 'Team Lead' %}team-lead{% endif %}">
        <img src="{{ url_for('static', filename='images/' + member.photo) }}" alt="{{ member.name }}" class="profile-photo" />
        <h3>{{ member.name }}</h3>
        <p class="role">{{ member.role }}</p>
        {% if member.role == 'Team Lead' %}
          <span class="lead-badge">Team Lead</span>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endblock %}
